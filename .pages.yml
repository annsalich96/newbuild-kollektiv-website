media:
  input: public
  output: /

content:
  - name: team
    label: "Team & Speaker-Galerie (Startseite)"
    type: file
    path: src/content/team.json
    format: json
    fields:
      - name: members
        label: "Team / weitere Personen - alle Speaker aus den Events kommen automatisch dazu (nach diesen Einträgen), hier also nur Personen eintragen, die in keinem Event als Speaker stehen"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Name
            type: string
          - name: image
            label: Foto (optional, solange leer bleibt der Platzhalter)
            type: image
            required: false
          - name: role
            label: "Rolle/Firma (optional, erscheint unter dem Namen)"
            type: string
            required: false
          - name: url
            label: "Website des Unternehmens (optional, z.B. https://firma.de) - Klick aufs Foto"
            type: string
            required: false

  - name: hero
    label: Hero-Bereich (Startseite)
    type: file
    path: src/content/hero.json
    format: json
    fields:
      - name: mode
        label: "Foto oder Video anzeigen?"
        type: select
        options:
          values: [Foto, Video]
      - name: photo
        label: "Foto (nur benutzt, wenn oben \"Foto\" gewaehlt ist - zum Austauschen einfach neues Foto hochladen)"
        type: image
        required: false
      - name: video
        label: "Video (nur benutzt, wenn oben \"Video\" gewaehlt ist - stumme Endlosschleife - zum Austauschen einfach neues Video hochladen)"
        type: file
        required: false

  - name: gallery
    label: Fotogalerie (Startseite)
    type: file
    path: src/content/gallery.json
    format: json
    fields:
      - name: photos
        label: Fotos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Foto {index}"
        fields:
          - name: photo
            label: Foto (optional, solange leer bleibt der Platzhalter)
            type: image
            required: false
          - name: alt
            label: Alt-Text (optional, für Barrierefreiheit)
            type: string
            required: false

  - name: sponsors
    label: Sponsoring
    type: file
    path: src/content/sponsors.json
    format: json
    fields:
      - name: statement
        label: "Spruch, der in der Sponsoren-Leiste mitläuft (Startseite)"
        type: text
      - name: sponsors
        label: "Sponsoren (Startseite - allgemeine Sponsoren-Leiste, optional - leer lassen wenn keine allgemeinen Sponsoren gezeigt werden sollen)"
        type: object
        required: false
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Name
            type: string
          - name: url
            label: "Website (optional) — Klick auf den Eintrag im Laufband öffnet sie"
            type: string
            required: false

  - name: mission-about
    label: Mission & About (Texte)
    type: file
    path: src/content/mission-about.json
    format: json
    fields:
      - name: missionText
        label: Mission-Text
        type: text
      - name: aboutText
        label: About-Text
        type: text

  - name: impressum
    label: Impressum (Seite)
    type: file
    path: src/content/impressum.json
    format: json
    fields:
      - name: sections
        label: Abschnitte
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{heading}"
        fields:
          - name: heading
            label: Überschrift
            type: string
          - name: body
            label: Text
            type: text

  - name: datenschutz
    label: Datenschutzerklärung (Seite)
    type: file
    path: src/content/datenschutz.json
    format: json
    fields:
      - name: sections
        label: Abschnitte
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{heading}"
        fields:
          - name: heading
            label: Überschrift
            type: string
          - name: body
            label: Text
            type: text

  - name: widerrufsrecht
    label: Widerrufsrecht (Seite)
    type: file
    path: src/content/widerrufsrecht.json
    format: json
    fields:
      - name: body
        label: Text
        type: text

  - name: einladung
    label: Einladungsmail (alle Events)
    type: file
    path: src/content/einladung.json
    format: json
    fields:
      - name: betreff
        label: Betreff
        type: string
        description: "Platzhalter wie im Text, z. B. {Kurztitel} und {Datum}."
      - name: text
        label: Text
        type: text
        description: "Wird pro Event automatisch gefüllt, Ergebnis unter newbuild-kollektiv.com/einladung/. Platzhalter: {Titel} · {Kurztitel} · {Untertitel} · {Datum} · {Zeit} · {Ort} · {Speaker} · {Moderation} · {Einstieg} (erster Satz der Eventbeschreibung) · {Link} (Anmeldeseite) · {Karte} (eigene Zeile: Eventkarte mit Button Anmeldung, verlinkt). Zeilen mit leerem Platzhalter fallen weg (z. B. Moderation)."
  - name: footer
    label: Fußzeile (global, alle Seiten)
    type: file
    path: src/content/footer.json
    format: json
    fields:
      - name: address
        label: Adresse
        type: string
      - name: phone
        label: Telefon
        type: string
      - name: email
        label: E-Mail
        type: string
      - name: impressumLabel
        label: Link-Text "Impressum"
        type: string
      - name: datenschutzLabel
        label: Link-Text "Datenschutz"
        type: string
      - name: widerrufsrechtLabel
        label: Link-Text "Widerrufsrecht"
        type: string
