media:
  input: public
  output: /

content:
  - name: events
    label: Events (Seite)
    type: file
    path: src/content/events.json
    format: json
    fields:
      - name: events
        label: Events
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{number} — {title}"
        fields:
          - name: slug
            label: "URL-Kürzel (nur Kleinbuchstaben/Zahlen/Bindestriche, keine Leerzeichen!)"
            type: string
          - name: number
            label: "Nummer (z.B. \"Session 01\", optional - Events ohne Session-Nummer wie \"Architecture Intelligence\" lassen das leer)"
            type: string
            required: false
          - name: introLabel
            label: "Label über dem Titel (Standard: \"Mission\", frei änderbar)"
            type: string
          - name: title
            label: Titel
            type: string
          - name: isNext
            label: Als "Next Event" auf der Startseite zeigen?
            type: boolean
          - name: date
            label: Datum
            type: string
          - name: time
            label: Zeit
            type: string
          - name: location
            label: Ort
            type: string
          - name: speakerName
            label: "Referent:in (optional - bei mehreren Speakern leer lassen und alle in der Kurzbeschreibung auflisten)"
            type: string
            required: false
          - name: speakerCompany
            label: Firma/Zusatz (optional)
            type: string
            required: false
          - name: speakerBio
            label: Referent:in — Kurzbeschreibung (optional)
            type: text
            required: false
          - name: speakerImage
            label: Referent:in — Foto (optional)
            type: image
            required: false
          - name: description
            label: Beschreibung
            type: text
          - name: sponsors
            label: "Sponsoren für dieses Event (optional - leer lassen zeigt die allgemeine Sponsoren-Leiste von der Startseite)"
            type: object
            required: false
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: name
                label: Name
                type: string

  - name: team
    label: Team
    type: file
    path: src/content/team.json
    format: json
    fields:
      - name: members
        label: Team-Mitglieder
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Name
            type: string
          - name: image
            label: Foto (optional, solange leer bleibt der Platzhalter)
            type: image
            required: false
          - name: role
            label: "Rolle/Firma (optional, erscheint unter dem Namen)"
            type: string
            required: false

  - name: hero
    label: Hero-Foto (Startseite)
    type: file
    path: src/content/hero.json
    format: json
    fields:
      - name: photo
        label: Foto (optional, solange leer bleibt der Platzhalter)
        type: image
        required: false

  - name: gallery
    label: Fotogalerie (Startseite)
    type: file
    path: src/content/gallery.json
    format: json
    fields:
      - name: photos
        label: Fotos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Foto {index}"
        fields:
          - name: photo
            label: Foto (optional, solange leer bleibt der Platzhalter)
            type: image
            required: false
          - name: alt
            label: Alt-Text (optional, für Barrierefreiheit)
            type: string
            required: false

  - name: sponsors
    label: Sponsoring
    type: file
    path: src/content/sponsors.json
    format: json
    fields:
      - name: statement
        label: "Spruch, der in der Sponsoren-Leiste mitläuft (Startseite)"
        type: text
      - name: sponsors
        label: "Sponsoren (Startseite - allgemeine Sponsoren-Leiste)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Name
            type: string

  - name: mission-about
    label: Mission & About (Texte)
    type: file
    path: src/content/mission-about.json
    format: json
    fields:
      - name: missionText
        label: Mission-Text
        type: text
      - name: aboutText
        label: About-Text
        type: text

  - name: impressum
    label: Impressum (Seite)
    type: file
    path: src/content/impressum.json
    format: json
    fields:
      - name: sections
        label: Abschnitte
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{heading}"
        fields:
          - name: heading
            label: Überschrift
            type: string
          - name: body
            label: Text
            type: text

  - name: datenschutz
    label: Datenschutzerklärung (Seite)
    type: file
    path: src/content/datenschutz.json
    format: json
    fields:
      - name: sections
        label: Abschnitte
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{heading}"
        fields:
          - name: heading
            label: Überschrift
            type: string
          - name: body
            label: Text
            type: text

  - name: widerrufsrecht
    label: Widerrufsrecht (Seite)
    type: file
    path: src/content/widerrufsrecht.json
    format: json
    fields:
      - name: body
        label: Text
        type: text

  - name: footer
    label: Fußzeile (global, alle Seiten)
    type: file
    path: src/content/footer.json
    format: json
    fields:
      - name: address
        label: Adresse
        type: string
      - name: phone
        label: Telefon
        type: string
      - name: email
        label: E-Mail
        type: string
      - name: impressumLabel
        label: Link-Text "Impressum"
        type: string
      - name: datenschutzLabel
        label: Link-Text "Datenschutz"
        type: string
      - name: widerrufsrechtLabel
        label: Link-Text "Widerrufsrecht"
        type: string
