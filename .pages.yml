media:
  input: public
  output: /

content:
  - name: events
    label: Events (Seite)
    type: file
    path: src/content/events.json
    format: json
    fields:
      - name: events
        label: Events
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{number} — {title}"
        fields:
          - name: slug
            label: "URL-Kürzel (nur Kleinbuchstaben/Zahlen/Bindestriche, keine Leerzeichen!)"
            type: string
          - name: number
            label: Nummer (z.B. "Session 01")
            type: string
          - name: title
            label: Titel
            type: string
          - name: isNext
            label: Als "Next Event" auf der Startseite zeigen?
            type: boolean
          - name: date
            label: Datum
            type: string
          - name: time
            label: Zeit
            type: string
          - name: location
            label: Ort
            type: string
          - name: speakerName
            label: Referent:in
            type: string
          - name: speakerCompany
            label: Firma/Zusatz (optional)
            type: string
          - name: description
            label: Beschreibung
            type: text

  - name: team
    label: Team
    type: file
    path: src/content/team.json
    format: json
    fields:
      - name: members
        label: Team-Mitglieder
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Name
            type: string
          - name: image
            label: Foto (optional, solange leer bleibt der Platzhalter)
            type: image
            required: false

  - name: sponsors
    label: Sponsoring
    type: file
    path: src/content/sponsors.json
    format: json
    fields:
      - name: sponsors
        label: Sponsoren
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Name
            type: string

  - name: mission-about
    label: Mission & About (Texte)
    type: file
    path: src/content/mission-about.json
    format: json
    fields:
      - name: missionText
        label: Mission-Text
        type: text
      - name: aboutText
        label: About-Text
        type: text
