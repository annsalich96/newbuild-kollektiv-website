media:
  input: public
  output: /

content:
  - name: events
    label: Events (Seite)
    type: file
    path: src/content/events.json
    format: json
    fields:
      - name: events
        label: Events
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{number} — {title}"
        fields:
          - name: slug
            label: "URL-Kürzel (nur Kleinbuchstaben/Zahlen/Bindestriche, keine Leerzeichen!)"
            type: string
          - name: number
            label: "Nummer (z.B. \"Session 01\", optional - Events ohne Session-Nummer wie \"Architecture Intelligence\" lassen das leer)"
            type: string
            required: false
          - name: introLabel
            label: "Label über dem Titel (Standard: \"Mission\", frei änderbar)"
            type: string
          - name: title
            label: Titel
            type: string
          - name: isNext
            label: Als "Next Event" auf der Startseite zeigen?
            type: boolean
          - name: color
            label: "Farbe (optional) — Farbcode wie #2f6f8f. Färbt den Hintergrund der Eventseite UND die Karte in den Mails. Leer lassen = NewBuild-Orange"
            type: string
            required: false
            pattern:
              regex: "^#?[0-9a-fA-F]{6}$"
              message: "Bitte einen 6-stelligen Farbcode eintragen, z. B. #2f6f8f"
          - name: date
            label: Datum
            type: string
          - name: time
            label: Zeit
            type: string
          - name: location
            label: Ort
            type: string
          - name: speakerName
            label: "Referent:in — Name (optional - bei mehreren Speakern leer lassen und alle in der Kurzbeschreibung auflisten)"
            type: string
            required: false
          - name: speakerRole
            label: "Referent:in — Position (optional, z.B. \"Geschäftsführer\" - nur die Position, KEIN Komma/Bindestrich, das setzt das System)"
            type: string
            required: false
          - name: speakerCompany
            label: "Referent:in — Firma (optional, nur der Firmenname - keine Position, keine Satzzeichen)"
            type: string
            required: false
          - name: speakerBio
            label: Referent:in — Kurzbeschreibung (optional)
            type: text
            required: false
          - name: speakerImage
            label: Referent:in — Foto (optional)
            type: image
            required: false
          - name: speakerUrl
            label: "Referent:in — Website des Unternehmens (optional, z.B. https://firma.de) - Klick aufs Foto in der Speaker-Galerie der Startseite"
            type: string
            required: false
          - name: description
            label: Beschreibung
            type: text
          - name: facts
            label: "Weitere Eckdaten (optional) - erscheinen unter Zeit/Ort, z.B. Fortbildung: 5 Punkte AK Berlin"
            type: object
            required: false
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: "Bezeichnung (kurz, z.B. Fortbildung, Einlass, Gastgeber)"
                type: string
              - name: value
                label: Inhalt
                type: string
          - name: program
            label: "Programm (optional) - Programmpunkte, Sessions, Ablauf"
            type: object
            required: false
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: time
                label: "Uhrzeit (optional, z.B. 18:30)"
                type: string
                required: false
              - name: title
                label: Titel
                type: string
              - name: text
                label: "Beschreibung (optional)"
                type: text
                required: false
          - name: hosts
            label: "Präsentiert von (optional) - Gastgeber:innen/Co-Veranstalter:innen"
            type: object
            required: false
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: name
                label: Name
                type: string
              - name: role
                label: "Rolle/Firma (optional)"
                type: string
                required: false
              - name: url
                label: "Link (optional)"
                type: string
                required: false
              - name: image
                label: "Foto (optional)"
                type: image
                required: false
          - name: partners
            label: "Partner (optional) - werden nach Kategorie gruppiert. Ohne eigene Sponsoren laufen sie auch im Laufband"
            type: object
            required: false
            list:
              collapsible:
                collapsed: true
                summary: "{category}: {name}"
            fields:
              - name: category
                label: "Kategorie (z.B. Technical Partner, Media Partner, Venue Partner)"
                type: string
              - name: name
                label: Name
                type: string
              - name: url
                label: "Link (optional)"
                type: string
                required: false
          - name: speakers
            label: "Speaker (optional, mehrere möglich) - ab 2 Einträgen wird der Bereich auf der Eventseite zum Slider. Leer lassen = die einzelnen Referent:in-Felder oben gelten"
            type: object
            required: false
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: name
                label: Name
                type: string
              - name: role
                label: "Position (optional)"
                type: string
                required: false
              - name: company
                label: "Firma (optional)"
                type: string
                required: false
              - name: bio
                label: "Kurzbeschreibung (optional)"
                type: text
                required: false
              - name: image
                label: "Foto (optional, am besten Hochformat 3:4)"
                type: image
                required: false
              - name: url
                label: "Website des Unternehmens (optional, z.B. https://firma.de) - Klick aufs Foto in der Speaker-Galerie der Startseite"
                type: string
                required: false
          - name: sponsors
            label: "Sponsoren für dieses Event (optional - leer lassen zeigt die allgemeine Sponsoren-Leiste von der Startseite)"
            type: object
            required: false
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: name
                label: Name
                type: string
          - name: gallery
            label: "Galerie nach dem Event (optional, 20-25 Fotos) - sobald das Event vorbei ist, ersetzt sie auf der Eventseite das Anmeldeformular"
            type: image
            required: false
            list: true

  - name: team
    label: "Team & Speaker-Galerie (Startseite)"
    type: file
    path: src/content/team.json
    format: json
    fields:
      - name: members
        label: "Team / weitere Personen - alle Speaker aus den Events kommen automatisch dazu (nach diesen Einträgen), hier also nur Personen eintragen, die in keinem Event als Speaker stehen"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Name
            type: string
          - name: image
            label: Foto (optional, solange leer bleibt der Platzhalter)
            type: image
            required: false
          - name: role
            label: "Rolle/Firma (optional, erscheint unter dem Namen)"
            type: string
            required: false
          - name: url
            label: "Website des Unternehmens (optional, z.B. https://firma.de) - Klick aufs Foto"
            type: string
            required: false

  - name: hero
    label: Hero-Bereich (Startseite)
    type: file
    path: src/content/hero.json
    format: json
    fields:
      - name: mode
        label: "Foto oder Video anzeigen?"
        type: select
        options:
          values: [Foto, Video]
      - name: photo
        label: "Foto (nur benutzt, wenn oben \"Foto\" gewaehlt ist - zum Austauschen einfach neues Foto hochladen)"
        type: image
        required: false
      - name: video
        label: "Video (nur benutzt, wenn oben \"Video\" gewaehlt ist - stumme Endlosschleife - zum Austauschen einfach neues Video hochladen)"
        type: file
        required: false

  - name: gallery
    label: Fotogalerie (Startseite)
    type: file
    path: src/content/gallery.json
    format: json
    fields:
      - name: photos
        label: Fotos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Foto {index}"
        fields:
          - name: photo
            label: Foto (optional, solange leer bleibt der Platzhalter)
            type: image
            required: false
          - name: alt
            label: Alt-Text (optional, für Barrierefreiheit)
            type: string
            required: false

  - name: sponsors
    label: Sponsoring
    type: file
    path: src/content/sponsors.json
    format: json
    fields:
      - name: statement
        label: "Spruch, der in der Sponsoren-Leiste mitläuft (Startseite)"
        type: text
      - name: sponsors
        label: "Sponsoren (Startseite - allgemeine Sponsoren-Leiste, optional - leer lassen wenn keine allgemeinen Sponsoren gezeigt werden sollen)"
        type: object
        required: false
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Name
            type: string

  - name: mission-about
    label: Mission & About (Texte)
    type: file
    path: src/content/mission-about.json
    format: json
    fields:
      - name: missionText
        label: Mission-Text
        type: text
      - name: aboutText
        label: About-Text
        type: text

  - name: impressum
    label: Impressum (Seite)
    type: file
    path: src/content/impressum.json
    format: json
    fields:
      - name: sections
        label: Abschnitte
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{heading}"
        fields:
          - name: heading
            label: Überschrift
            type: string
          - name: body
            label: Text
            type: text

  - name: datenschutz
    label: Datenschutzerklärung (Seite)
    type: file
    path: src/content/datenschutz.json
    format: json
    fields:
      - name: sections
        label: Abschnitte
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{heading}"
        fields:
          - name: heading
            label: Überschrift
            type: string
          - name: body
            label: Text
            type: text

  - name: widerrufsrecht
    label: Widerrufsrecht (Seite)
    type: file
    path: src/content/widerrufsrecht.json
    format: json
    fields:
      - name: body
        label: Text
        type: text

  - name: footer
    label: Fußzeile (global, alle Seiten)
    type: file
    path: src/content/footer.json
    format: json
    fields:
      - name: address
        label: Adresse
        type: string
      - name: phone
        label: Telefon
        type: string
      - name: email
        label: E-Mail
        type: string
      - name: impressumLabel
        label: Link-Text "Impressum"
        type: string
      - name: datenschutzLabel
        label: Link-Text "Datenschutz"
        type: string
      - name: widerrufsrechtLabel
        label: Link-Text "Widerrufsrecht"
        type: string
