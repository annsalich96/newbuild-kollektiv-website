<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__TITLE__ — NewBuild Kollektiv</title>
    <meta name="description" content="__NUMBER__ — __TITLE__, __DATE__, __LOCATION__." />
  </head>
  <body>
    <div class="event-hero">
      <div class="mobile-nav-bar">
        <h1 class="hero__logo">
          <img src="/logo-wordmark.png" alt="NewBuild Kollektiv" width="815" height="195" />
        </h1>
        <button
          type="button"
          class="mobile-nav-toggle"
          aria-label="Menü öffnen"
          aria-expanded="false"
          aria-controls="mobile-nav-panel"
        >
          <span aria-hidden="true">+</span>
        </button>
      </div>
      <nav id="mobile-nav-panel" class="mobile-nav-panel" aria-label="Hauptnavigation" hidden>
        <a href="/#mission">Mission</a>
        <a href="/#events">Events</a>
        <a href="/#sponsoring">Sponsoring</a>
        <a href="/#about">About</a>
      </nav>

      <header class="site-nav">
        <div class="site-nav__pill">
          <a href="/" class="site-nav__logo" aria-label="NewBuild Kollektiv Startseite">
            <img src="/logo-mark.png" alt="" width="29" height="28" />
          </a>
          <nav aria-label="Hauptnavigation">
            <a href="/#mission">Mission</a>
            <a href="/#events">Events</a>
            <a href="/#sponsoring">Sponsoring</a>
            <a href="/#about">About</a>
          </nav>
        </div>
      </header>

      <section class="grid event-detail__intro">
        <p class="section__eyebrow">__NUMBER__</p>
        <div class="event-detail__intro-content">
          <h2 class="event-detail__title">__TITLE__</h2>
          __DESCRIPTION_PARAGRAPHS__
        </div>
      </section>

      <div class="grid divider-row"><hr class="divider" /></div>

      <section class="grid event-detail__speaker">
        <div class="event-detail__speaker-info">
          <h3 class="event-detail__speaker-name">__SPEAKER__</h3>
          __SPEAKER_BIO_BLOCK__
        </div>
        <figure class="event-detail__speaker-photo">__SPEAKER_PHOTO__</figure>
      </section>

      <div class="grid divider-row"><hr class="divider" /></div>

      <div class="marquee sponsor-marquee" aria-label="Sponsoren">
        <div class="marquee__inner">
          <ul class="marquee__track" id="sponsor-track"></ul>
        </div>
      </div>
    </div>

    <section class="event-form-section">
      <div class="grid">
        <p class="event-form-section__label">Anmeldeformular</p>
        <form
          class="event-form"
          id="event-form"
          data-event-slug="__SLUG__"
          data-event-number="__NUMBER__"
          data-event-title="__TITLE__"
          data-event-date="__DATE__"
          data-event-time="__TIME__"
          data-event-location="__LOCATION__"
        >
          <div class="event-form__row">
            <label>
              <span>Vorname</span>
              <input type="text" name="firstName" required />
            </label>
            <label>
              <span>Nachname</span>
              <input type="text" name="lastName" required />
            </label>
          </div>
          <div class="event-form__row">
            <label>
              <span>Unternehmen</span>
              <input type="text" name="company" />
            </label>
            <label>
              <span>Unternehmensadresse</span>
              <input type="text" name="companyAddress" />
            </label>
          </div>
          <div class="event-form__row">
            <label>
              <span>Email</span>
              <input type="email" name="email" required />
            </label>
            <label>
              <span>Telefonnummer</span>
              <input type="tel" name="phone" />
            </label>
          </div>
          <label class="event-form__checkbox">
            <input type="checkbox" name="newsletter" />
            <span>Bitte informiere mich über anstehende Events.</span>
          </label>
          <label class="event-form__checkbox">
            <input type="checkbox" name="privacy" required />
            <span
              >Ich habe die
              <a href="/datenschutzerklaerung.html" target="_blank" rel="noreferrer"
                >Datenschutzerklärung</a
              >
              gelesen und stimme zu.</span
            >
          </label>
          <button type="submit" class="button event-form__submit">Verbindlich anmelden</button>
          <p class="event-form__status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <footer class="site-footer">
      <div class="grid">
        <div class="site-footer__col">
          <span id="footer-address"></span>
          <a id="footer-phone" href="tel:"></a>
          <a id="footer-email" href="mailto:"></a>
        </div>
        <div class="site-footer__col">
          <a href="/impressum.html">Impressum</a>
          <a href="/datenschutzerklaerung.html">Datenschutzerklärung</a>
          <a href="/widerrufsrecht.html">Widerrufsrecht</a>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/event-form.ts"></script>
  </body>
</html>
